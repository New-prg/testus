[project]
name = "diplom2-backend"
version = "0.1.0"
description = "Driving efficiency analytics FastAPI MVP"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "email-validator>=2.1.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "bcrypt<5",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.2.1",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5.0",
    "sqlalchemy>=2.0.29",
    "uvicorn[standard]>=0.29.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
