services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: driving_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d driving_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DEMO_DATASET_PATH: /demo-dataset/telematics_reduced_long.csv
      DEMO_SENSOR_PROFILE_PATH: /demo-dataset/sensor_profile_canonical.json
      DEMO_DATASET_ROW_LIMIT: "-1"
    volumes:
      - ../../dataset/pilot_sensor_dataset_2026-05-31_reduction:/demo-dataset:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8000:8000"

  sync-worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DEMO_DATASET_PATH: /demo-dataset/telematics_reduced_long.csv
      DEMO_SENSOR_PROFILE_PATH: /demo-dataset/sensor_profile_canonical.json
      DEMO_DATASET_ROW_LIMIT: "-1"
    volumes:
      - ../../dataset/pilot_sensor_dataset_2026-05-31_reduction:/demo-dataset:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    command: python -u -m app.cli sync-worker

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
